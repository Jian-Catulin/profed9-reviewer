<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFED 9 Reviewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- DASHBOARD SCREEN -->
        <div id="dashboard-screen" class="screen">
            <h1>PROFED 9 Reviewer</h1>
            <p class="subtitle">Methods of Research</p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="stat-answered">0</span>
                    <span class="stat-label">Answered</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value correct-text" id="stat-correct">0</span>
                    <span class="stat-label">Correct</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value incorrect-text" id="stat-incorrect">0</span>
                    <span class="stat-label">Incorrect</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="stat-accuracy">0%</span>
                    <span class="stat-label">Accuracy</span>
                </div>
            </div>

            <div class="mode-selection">
                <h3>Select Quiz Mode</h3>
                <button id="mode-mc-btn" class="primary-btn">📝 Multiple Choice (50 Items)</button>
                <button id="mode-ident-btn" class="primary-btn">⌨️ Identification (80 Items)</button>
            </div>
            <!-- Javascript will automatically inject the Retry and Clear buttons here -->
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="screen hidden">
            <div class="quiz-header">
                <span id="question-counter">Question 1 of 50</span>
                <button id="return-btn" class="text-btn">← Dashboard</button>
            </div>
            
            <h2 id="question-text">Question text goes here...</h2>
            
            <!-- Multiple Choice Container -->
            <div id="options-container" class="options-grid hidden">
                <!-- Javascript generates buttons here -->
            </div>

            <!-- Identification Container -->
            <div id="identification-container" class="ident-box hidden">
                <input type="text" id="ident-input" placeholder="Type your answer here..." autocomplete="off">
                <button id="submit-ident-btn" class="primary-btn">Submit Answer</button>
            </div>

            <!-- Explanation Box -->
            <div id="explanation-box" class="hidden">
                <h3 id="explanation-title"></h3>
                <p id="explanation-text"></p>
            </div>

            <button id="next-btn" class="success-btn hidden">Next Question →</button>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen hidden">
            <h2>Quiz Complete! 🎉</h2>
            <p id="final-score" class="score-display">You scored X out of Y</p>
            <button id="restart-btn" class="primary-btn">Back to Dashboard</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
